<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub - Mens</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
        }

        nav {
            background-color: #222;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: pink;
        }

        .heading {
            text-align: center;
            padding: 35px;
            background-color: #dbeafe;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 40px;
        }

        .product {
            background-color: white;
            width: 250px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px gray;
        }

        .product img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <a href="../index.html">Home</a>
        <a href="../kids/kids.html">Kids</a>
        <a href="mens.html">Mens</a>
        <a href="../ladies/ladies.html">Ladies</a>
    </nav>

    <!-- Mens Heading -->
    <div class="heading">
        <h1>Mens Collection</h1>
        <p>Smart and Stylish Fashion for Men</p>
    </div>

    <!-- Mens Products -->
    <div class="products">

        <!-- Picture 1 -->
        <div class="product">
            <img src="assets/mens1.jpg" alt="Mens Product">
            <h2>Casual Shirt</h2>
            <p>Rs. 1999</p>
        </div>

        <!-- Picture 2 -->
        <div class="product">
            <img src="assets/mens2.jpg" alt="Mens Product">
            <h2>T-Shirt</h2>
            <p>Rs. 1299</p>
        </div>

        <!-- Picture 3 -->
        <div class="product">
            <img src="assets/mens3.jpg" alt="Mens Product">
            <h2>Denim Jacket</h2>
            <p>Rs. 2499</p>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 StyleHub | Mens Collection</p>
    </footer>

</body>
</html>
