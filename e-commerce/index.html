<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub - Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
        }

        nav {
            background-color: #222;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: pink;
        }

        .hero {
            text-align: center;
            padding: 50px;
            background-color: #ffe4ec;
        }

        .hero h1 {
            font-size: 40px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 40px;
        }

        .product {
            background-color: white;
            width: 250px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px gray;
        }

        .product img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="kids/kids.html">Kids</a>
        <a href="mens/mens.html">Mens</a>
        <a href="ladies/ladies.html">Ladies</a>
    </nav>

    <!-- Home Section -->
    <div class="hero">
        <h1>Welcome to StyleHub</h1>
        <p>Fashion for Everyone</p>
    </div>

    <!-- Products -->
    <div class="products">

        <!-- Picture 1: Apni picture yahan lagayen -->
        <div class="product">
            <img src="assets/home1.jpg" alt="Product">
            <h2>New Collection</h2>
            <p>Latest Fashion</p>
        </div>

        <!-- Picture 2 -->
        <div class="product">
            <img src="assets/home2.jpg" alt="Product">
            <h2>Best Sellers</h2>
            <p>Shop Now</p>
        </div>

        <!-- Picture 3 -->
        <div class="product">
            <img src="assets/home3.jpg" alt="Product">
            <h2>Special Collection</h2>
            <p>Explore Now</p>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 StyleHub | E-Commerce Website</p>
    </footer>

</body>
</html>
